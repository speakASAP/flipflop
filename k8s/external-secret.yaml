apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flipflop-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flipflop-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/flipflop-service
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/flipflop-service
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/flipflop-service
        property: JWT_SECRET
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: AI_SERVICE_TOKEN
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/flipflop-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/flipflop-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDERS_SERVICE_TOKEN
    - secretKey: ORDERS_STATUS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDERS_STATUS_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: WAREHOUSE_SERVICE_TOKEN
    # Pair tokens live in the per-caller ExternalSecrets below. They must not
    # sit in this Secret: every flipflop Deployment envFroms it, so a key here
    # is a credential shared across five callers.
    - secretKey: LEADS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: LEADS_SERVICE_TOKEN
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/flipflop-service
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: BANK_TRANSFER_ACCOUNT_NUMBER
      remoteRef:
        key: secret/prod/school-committee/payments
        property: PAYMENT_ACCOUNT_NUMBER
    - secretKey: BANK_TRANSFER_ACCOUNT_IBAN
      remoteRef:
        key: secret/prod/school-committee/payments
        property: PAYMENT_ACCOUNT_IBAN
    - secretKey: TEST_PASSWORD
      remoteRef:
        key: secret/prod/flipflop-service
        property: TEST_PASSWORD

    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: JWT_TOKEN
    # Own property, not JWT_TOKEN. This is the shared key for the intra-flipflop
    # payment-result webhook (api-gateway -> order-service). It previously read
    # property: JWT_TOKEN, which meant one Vault write changed this key, JWT_TOKEN
    # and marketing's replay token at once -- rotating any one of the three broke
    # the other two. Each job now has its own property so they rotate independently.
    # Seeded with the identical value first, so this remap is byte-neutral.
    - secretKey: FLIPFLOP_INTERNAL_SERVICE_SECRET
      remoteRef:
        key: secret/prod/flipflop-service
        property: FLIPFLOP_INTERNAL_SERVICE_SECRET
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    #
    # NOTE the Vault property is PLURAL. monitoring's own ExternalSecret maps env
    # NOTIFICATION_SERVICE_TOKEN <- Vault NOTIFICATIONS_SERVICE_TOKEN, and
    # MonitoringIngestGuard compares against that running value. The singular key
    # also exists in monitoring's path with a stale value the guard rejects.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
---
# One Secret per caller so pair JWTs are secretKeyRef'd, never envFrom'd.
# Kubernetes cannot exclude keys from envFrom; a shared Secret is the leak.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flipflop-product-service-tokens
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flipflop-product-service-tokens
    creationPolicy: Owner
  data:
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: PRODUCT_LOGGING_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: PRODUCT_WAREHOUSE_SERVICE_TOKEN
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: PRODUCT_CATALOG_SERVICE_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flipflop-cart-service-tokens
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flipflop-cart-service-tokens
    creationPolicy: Owner
  data:
    # Role internal:catalog-microservice:service -- reads only.
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: CART_CATALOG_SERVICE_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flipflop-order-service-tokens
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flipflop-order-service-tokens
    creationPolicy: Owner
  data:
    # Role internal:catalog-microservice:service -- reads only.
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDER_CATALOG_SERVICE_TOKEN
    # Per-pair RS256 ingest credential for flipflop-order-service -> logging
    # (svc-flipflop-order-service--logging-microservice@internal.alfares.cz,
    # role internal:logging-microservice:ingest). Replaces shared
    # logging-ingest-credentials (static non-JWT).
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDER_LOGGING_SERVICE_TOKEN
